services:
  postgres:
    image: postgres:17
    container_name: apex-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex_motors

    ports:
      - "5433:5432"

    volumes:
      - apex-postgres-data:/var/lib/postgresql/data

volumes:
  apex-postgres-data:
    external: true
    name: apex-postgres-data
